<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3" />
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <!-- Background -->
  <rect width="1440" height="900" fill="#f0f4ff"/>
  <!-- Blobs -->
  <ellipse cx="200" cy="150" rx="350" ry="280" fill="url(#g1)" opacity="0.12" filter="url(#blur1)"/>
  <ellipse cx="1300" cy="750" rx="400" ry="300" fill="#06b6d4" opacity="0.10" filter="url(#blur1)"/>
  <ellipse cx="800" cy="450" rx="500" ry="350" fill="#4f46e5" opacity="0.06" filter="url(#blur2)"/>
  <ellipse cx="100" cy="800" rx="250" ry="200" fill="#f59e0b" opacity="0.08" filter="url(#blur1)"/>
  <ellipse cx="1350" cy="100" rx="200" ry="180" fill="#818cf8" opacity="0.10" filter="url(#blur1)"/>
  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#4f46e5" opacity="0.12"/>
  </pattern>
  <rect width="1440" height="900" fill="url(#dots)"/>
  <!-- Floating shapes -->
  <circle cx="720" cy="80" r="60" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.12"/>
  <circle cx="720" cy="80" r="40" fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.08"/>
  <circle cx="1200" cy="400" r="80" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.10"/>
  <circle cx="250" cy="600" r="50" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.12"/>
  <!-- Lines -->
  <line x1="0" y1="300" x2="400" y2="0" stroke="#4f46e5" stroke-width="0.8" opacity="0.06"/>
  <line x1="1440" y1="200" x2="900" y2="900" stroke="#06b6d4" stroke-width="0.8" opacity="0.06"/>
  <line x1="600" y1="0" x2="1440" y2="600" stroke="#818cf8" stroke-width="0.8" opacity="0.05"/>
</svg>
